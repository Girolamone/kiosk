<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Inline styles rather than attributes so the mark can follow the
       viewer's theme: a dark-green tile disappears into a dark browser tab. -->
  <style>
    .tile { fill: #1c5c47 }
    .mark { stroke: #faf8f5 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #4c9c7c }
      .mark { stroke: #14130f }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7.5"/>
  <g class="mark" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 8.5v15"/>
    <path d="M21.5 8.5 13 16.2"/>
    <path d="M13.6 15.2 21.8 23.5"/>
  </g>
</svg>
