name: API

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Scoped to graph/, which is what gqlgen owns. A wider diff would also
      # catch module changes and report them as stale generated code.
      - name: Check generated code is current
        run: |
          go tool gqlgen generate
          if ! git diff --quiet -- graph/; then
            echo "Generated code is stale. Run: go tool gqlgen generate"
            git diff --stat -- graph/
            exit 1
          fi
